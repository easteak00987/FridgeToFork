name: CD

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  publish-images:
    runs-on: ubuntu-latest

    outputs:
      app_image: ${{ steps.export.outputs.app_image }}
      client_image: ${{ steps.export.outputs.client_image }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract app image metadata
        id: app-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/fridgetofork-app
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract client image metadata
        id: client-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/fridgetofork-client
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app/Dockerfile
          push: true
          tags: ${{ steps.app-meta.outputs.tags }}
          labels: ${{ steps.app-meta.outputs.labels }}

      - name: Build and push client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/client/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=${{ secrets.CD_VITE_API_URL || 'http://localhost:8000/api' }}
            VITE_GOOGLE_CLIENT_ID=${{ secrets.CD_GOOGLE_CLIENT_ID || '' }}
          tags: ${{ steps.client-meta.outputs.tags }}
          labels: ${{ steps.client-meta.outputs.labels }}

      - name: Export deploy image references
        id: export
        run: |
          echo "app_image=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/fridgetofork-app:latest" >> "$GITHUB_OUTPUT"
          echo "client_image=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/fridgetofork-client:latest" >> "$GITHUB_OUTPUT"

  deploy:
    runs-on: ubuntu-latest
    needs: publish-images
    if: ${{ secrets.DEPLOY_HOST != '' && secrets.DEPLOY_USER != '' && secrets.DEPLOY_SSH_KEY != '' && secrets.DEPLOY_TARGET_DIR != '' && secrets.DEPLOY_ENV_FILE != '' && secrets.GHCR_USERNAME != '' && secrets.GHCR_TOKEN != '' }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Copy deploy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: docker-compose.deploy.yml
          target: ${{ secrets.DEPLOY_TARGET_DIR }}

      - name: Deploy application
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_IMAGE: ${{ needs.publish-images.outputs.app_image }}
          CLIENT_IMAGE: ${{ needs.publish-images.outputs.client_image }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DEPLOY_ENV_FILE: ${{ secrets.DEPLOY_ENV_FILE }}
          DEPLOY_TARGET_DIR: ${{ secrets.DEPLOY_TARGET_DIR }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: APP_IMAGE,CLIENT_IMAGE,GHCR_USERNAME,GHCR_TOKEN,DEPLOY_ENV_FILE,DEPLOY_TARGET_DIR
          script: |
            set -e
            mkdir -p "$DEPLOY_TARGET_DIR"
            cd "$DEPLOY_TARGET_DIR"
            printf '%s' "$DEPLOY_ENV_FILE" > .env
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            export APP_IMAGE="$APP_IMAGE"
            export CLIENT_IMAGE="$CLIENT_IMAGE"
            docker compose -f docker-compose.deploy.yml pull
            docker compose -f docker-compose.deploy.yml up -d
