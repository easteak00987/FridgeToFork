name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_sqlite, sqlite3, mbstring, bcmath
          tools: composer:v2
          coverage: none

      - name: Validate Composer files
        run: composer validate --no-check-publish

      - name: Install backend dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          php artisan key:generate --force

      - name: Lint PHP files
        run: find app config database routes tests -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Smoke-check Laravel bootstrap
        run: php artisan route:list

      - name: Run backend tests
        run: php artisan test

      - name: Build Laravel Vite assets
        run: |
          npm ci
          npm run build

      - name: Build backend container
        run: docker build -f docker/app/Dockerfile .

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Build frontend container
        run: docker build -f ../docker/client/Dockerfile ..
